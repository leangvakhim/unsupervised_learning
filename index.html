<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsupervised Learning Dashboard</title>

    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configure Tailwind theme (optional, for custom colors) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen font-sans antialiased">

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-6 py-12">

        <!-- Header Section -->
        <header class="mb-12 text-center md:text-left flex flex-col md:flex-row md:items-end justify-between gap-6">
            <div>
                <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-slate-900 mb-3">
                    Unsupervised <span
                        class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">Learning</span>
                </h1>
                <p class="text-lg text-slate-600 max-w-2xl">
                    Explore algorithms that find hidden patterns or intrinsic structures in data without pre-existing
                    labels.
                </p>
            </div>
        </header>

        <!-- Topic Cards Container -->
        <div id="topicsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Cards will be injected here by JavaScript -->
        </div>

    </main>

    <!-- Application Logic -->
    <script>
        // 1. Define the data structure
        const topics = [
            {
                id: 'clustering',
                title: 'Clustering',
                description: 'Group similar data points together. Algorithms attempt to find natural groupings in data, such as customer segmentation.',
                href: './html/clustering.html',
                icon: `<svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>`
            },
            {
                id: 'dimensionality_reduction',
                title: 'Dimensionality Reduction',
                description: 'Reduce the number of random variables under consideration by obtaining a set of principal variables. Useful for visualization and compression.',
                href: './html/dimensionality_reduction.html',
                icon: `<svg class="w-8 h-8 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>`
            }
        ];

        // 2. Grab DOM elements
        const container = document.getElementById('topicsContainer');

        // 3. Function to render cards
        function renderCards(data) {
            container.innerHTML = ''; // Clear current content

            if (data.length === 0) {
                container.innerHTML = `
                    <div class="col-span-1 md:col-span-2 text-center py-12 text-slate-500">
                        No topics found.
                    </div>
                `;
                return;
            }

            data.forEach(topic => {
                // Create card HTML
                const cardHtml = `
                    <a href="${topic.href}" class="group block h-full">
                        <div class="bg-white rounded-2xl p-6 h-full border border-slate-200 shadow-sm hover:shadow-xl hover:border-blue-300 transition-all duration-300 flex flex-col transform hover:-translate-y-1">
                            <div class="flex items-center gap-4 mb-4">
                                <div class="p-3 bg-slate-50 rounded-lg group-hover:bg-blue-50 transition-colors duration-300">
                                    ${topic.icon}
                                </div>
                                <h2 class="text-xl font-bold text-slate-800 group-hover:text-blue-600 transition-colors duration-300">
                                    ${topic.title}
                                </h2>
                            </div>

                            <p class="text-slate-600 mb-6 flex-grow leading-relaxed">
                                ${topic.description}
                            </p>

                            <div class="mt-auto">
                                <div class="flex items-center text-blue-600 font-semibold text-sm group-hover:translate-x-1 transition-transform duration-300">
                                    Explore Topic
                                    <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                                    </svg>
                                </div>
                            </div>
                        </div>
                    </a>
                `;
                container.innerHTML += cardHtml;
            });
        }

        // 4. Initial render
        renderCards(topics);
    </script>
</body>

</html>
